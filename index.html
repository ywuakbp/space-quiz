<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1226" />
    <title>Mission Control · Space Quiz</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef2ff;
        --bg-accent: #dff8ff;
        --surface: rgba(255, 255, 255, 0.88);
        --surface-solid: #ffffff;
        --surface-soft: #f5f7ff;
        --text: #17213d;
        --muted: #687391;
        --line: #dce3f5;
        --accent: #6656f6;
        --accent-2: #08a7c9;
        --accent-soft: #eceaff;
        --success: #1c9a69;
        --success-soft: #ddf8e9;
        --danger: #dd4968;
        --danger-soft: #ffe4e9;
        --shadow: 0 25px 70px rgba(39, 44, 94, 0.16);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c1021;
          --bg-accent: #102d45;
          --surface: rgba(22, 28, 53, 0.92);
          --surface-solid: #161c35;
          --surface-soft: #1d2542;
          --text: #f3f6ff;
          --muted: #a5afcc;
          --line: #303956;
          --accent: #9a8dff;
          --accent-2: #4bd2e7;
          --accent-soft: #302b63;
          --success: #52d79c;
          --success-soft: #183d38;
          --danger: #ff829a;
          --danger-soft: #4c2537;
          --shadow: 0 25px 75px rgba(0, 0, 0, 0.35);
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px 18px;
        overflow-x: hidden;
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 15px;
        line-height: 1.5;
        background:
          radial-gradient(circle at 16% 7%, rgba(116, 103, 255, 0.2), transparent 25rem),
          radial-gradient(circle at 93% 94%, rgba(42, 205, 231, 0.2), transparent 24rem),
          var(--bg);
      }

      body::before,
      body::after {
        position: fixed;
        z-index: -1;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        content: "";
        background: var(--accent);
        box-shadow:
          18vw 12vh 0 1px var(--accent-2),
          35vw 75vh 0 0 var(--accent),
          71vw 19vh 0 1px var(--accent-2),
          85vw 61vh 0 0 var(--accent),
          57vw 92vh 0 1px var(--accent-2),
          7vw 89vh 0 0 var(--accent-2);
        opacity: 0.45;
      }

      body::before {
        top: 7%;
        left: 6%;
      }

      body::after {
        right: 8%;
        bottom: 8%;
        opacity: 0.3;
        transform: scale(0.7);
      }

      button {
        font: inherit;
      }

      .app {
        width: min(100%, 620px);
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        padding: 0 6px;
      }

      .brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        padding: 5px 12px 5px 5px;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
        border-radius: 14px;
        background:
          linear-gradient(
            135deg,
            color-mix(in srgb, var(--surface-solid) 86%, var(--accent-soft)),
            color-mix(in srgb, var(--surface) 88%, transparent)
          );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.22),
          0 8px 24px rgba(40, 47, 95, 0.1);
      }

      .brand::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        opacity: 0.22;
        background: repeating-linear-gradient(
          180deg,
          transparent 0 3px,
          color-mix(in srgb, var(--accent) 22%, transparent) 4px 5px
        );
      }

      .brand::after {
        position: absolute;
        top: -80%;
        left: -18%;
        width: 16%;
        height: 260%;
        pointer-events: none;
        content: "";
        opacity: 0.16;
        background: linear-gradient(90deg, transparent, var(--accent-2), transparent);
        transform: rotate(22deg);
        animation: brand-scan 5.5s ease-in-out infinite;
      }

      .brand-mark,
      .brand-copy {
        position: relative;
        z-index: 1;
      }

      .brand-mark {
        display: grid;
        flex: 0 0 32px;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        font-size: 16px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.32),
          0 8px 20px rgba(102, 86, 246, 0.28);
      }

      .brand-copy {
        display: grid;
        min-width: 0;
        gap: 3px;
      }

      .brand-name {
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
        line-height: 1;
        text-transform: uppercase;
      }

      .brand-status {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow: hidden;
        color: var(--muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.09em;
        line-height: 1;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .live-dot {
        flex: 0 0 5px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 18%, transparent);
        animation: live-pulse 1.8s ease-in-out infinite;
      }

      .score-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        background: var(--surface);
        box-shadow: 0 5px 16px rgba(40, 47, 95, 0.07);
      }

      .score-pill strong {
        color: var(--text);
      }

      .card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .quiz-view {
        padding: clamp(24px, 5vw, 42px);
      }

      .progress-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 9px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .progress-track {
        width: 100%;
        height: 9px;
        overflow: hidden;
        border-radius: 99px;
        background: var(--surface-soft);
      }

      .progress-fill {
        width: 10%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 16px rgba(75, 210, 231, 0.35);
        transition: width 450ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .question-wrap {
        animation: rise-in 420ms ease both;
      }

      .eyebrow {
        margin: 34px 0 9px;
        color: var(--accent-2);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        max-width: 530px;
        margin-bottom: 25px;
        font-size: clamp(1.65rem, 4vw, 2.25rem);
        line-height: 1.13;
        letter-spacing: -0.045em;
      }

      .answers {
        display: grid;
        gap: 11px;
      }

      .answer {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 59px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 15px;
        color: var(--text);
        text-align: left;
        cursor: pointer;
        background: color-mix(in srgb, var(--surface-solid) 74%, transparent);
        transition:
          border-color 180ms ease,
          background 180ms ease,
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      .answer:hover:not(:disabled),
      .answer:focus-visible {
        border-color: var(--accent);
        outline: none;
        background: var(--accent-soft);
        box-shadow: 0 7px 18px rgba(102, 86, 246, 0.13);
        transform: translateY(-2px);
      }

      .answer:focus-visible {
        box-shadow:
          0 0 0 3px var(--surface-solid),
          0 0 0 5px var(--accent);
      }

      .answer:disabled {
        cursor: default;
      }

      .answer-marker {
        display: grid;
        flex: 0 0 31px;
        width: 31px;
        height: 31px;
        margin-right: 12px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        background: var(--surface-soft);
      }

      .answer.correct {
        border-color: var(--success);
        background: var(--success-soft);
        animation: correct-pop 420ms ease both;
      }

      .answer.correct .answer-marker {
        border-color: var(--success);
        color: #fff;
        background: var(--success);
      }

      .answer.wrong {
        border-color: var(--danger);
        background: var(--danger-soft);
        animation: wrong-shake 450ms ease both;
      }

      .answer.wrong .answer-marker {
        border-color: var(--danger);
        color: #fff;
        background: var(--danger);
      }

      .answer.reveal {
        border-color: var(--success);
        background: var(--success-soft);
      }

      .answer.reveal .answer-marker {
        border-color: var(--success);
        color: #fff;
        background: var(--success);
      }

      .feedback {
        min-height: 28px;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }

      .feedback.good {
        color: var(--success);
      }

      .feedback.bad {
        color: var(--danger);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 14px;
      }

      .next-button,
      .restart-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 46px;
        padding: 11px 18px;
        border: 0;
        border-radius: 13px;
        color: #fff;
        font-weight: 800;
        cursor: pointer;
        background: linear-gradient(110deg, var(--accent), #8974ff);
        box-shadow: 0 10px 22px rgba(102, 86, 246, 0.24);
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          opacity 180ms ease;
      }

      .next-button:hover,
      .next-button:focus-visible,
      .restart-button:hover,
      .restart-button:focus-visible {
        outline: none;
        box-shadow: 0 13px 26px rgba(102, 86, 246, 0.35);
        transform: translateY(-2px);
      }

      .next-button:focus-visible,
      .restart-button:focus-visible {
        box-shadow:
          0 0 0 3px var(--surface-solid),
          0 0 0 5px var(--accent);
      }

      .next-button[hidden] {
        display: none;
      }

      .results {
        padding: clamp(34px, 7vw, 60px) clamp(24px, 8vw, 72px);
        text-align: center;
        animation: rise-in 420ms ease both;
      }

      .results-emoji {
        display: grid;
        width: 88px;
        height: 88px;
        margin: 0 auto 22px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 28px;
        font-size: 48px;
        background:
          radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.25), transparent 55%),
          var(--accent-soft);
        box-shadow: 0 13px 30px rgba(102, 86, 246, 0.18);
        animation: float 3.5s ease-in-out infinite;
      }

      .results h2 {
        margin-bottom: 8px;
        font-size: clamp(1.7rem, 4vw, 2.35rem);
        letter-spacing: -0.04em;
      }

      .result-copy {
        max-width: 370px;
        margin: 0 auto 26px;
        color: var(--muted);
      }

      .result-score {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        margin-bottom: 28px;
        color: var(--accent);
        font-size: 3.75rem;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.08em;
      }

      .result-score small {
        color: var(--muted);
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      .results-actions {
        display: grid;
        gap: 12px;
      }

      .results-actions .restart-button {
        width: 100%;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes correct-pop {
        0%,
        100% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.012);
        }
      }

      @keyframes wrong-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-7px);
        }
        40% {
          transform: translateX(6px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(3px);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }
        50% {
          transform: translateY(-7px) rotate(2deg);
        }
      }

      @keyframes live-pulse {
        0%,
        100% {
          opacity: 0.7;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      @keyframes brand-scan {
        0%,
        25% {
          transform: translateX(0) rotate(22deg);
        }
        65%,
        100% {
          transform: translateX(800%) rotate(22deg);
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 16px 12px;
        }

        .topbar {
          margin-bottom: 13px;
        }

        .brand {
          gap: 8px;
          padding-right: 9px;
        }

        .brand-status {
          font-size: 7px;
        }

        .quiz-view {
          padding: 22px 18px 24px;
        }

        .eyebrow {
          margin-top: 27px;
        }

        .answer {
          min-height: 54px;
          padding: 10px;
        }

        .answer-marker {
          flex-basis: 28px;
          width: 28px;
          height: 28px;
          margin-right: 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand" aria-label="Mission control, orbital systems online">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span class="brand-copy">
            <span class="brand-name">Mission control</span>
            <span class="brand-status">
              <span class="live-dot" aria-hidden="true"></span>
              Orbital systems / online
            </span>
          </span>
        </div>
        <div class="score-pill" aria-live="polite">
          <span aria-hidden="true">🏆</span>
          <span>Score <strong id="score">0</strong></span>
        </div>
      </header>

      <section class="card" aria-label="Space exploration quiz">
        <div id="quiz-view" class="quiz-view">
          <div class="progress-meta">
            <span>Space exploration quiz</span>
            <span id="progress-label">1 / 10</span>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-label="Quiz progress"
            aria-valuemin="1"
            aria-valuemax="10"
            aria-valuenow="1"
          >
            <div id="progress-fill" class="progress-fill"></div>
          </div>

          <div id="question-wrap" class="question-wrap">
            <p id="question-kicker" class="eyebrow">Question 01</p>
            <h1 id="question">Loading your first mission...</h1>
            <div id="answers" class="answers" role="group" aria-label="Answer choices"></div>
            <p id="feedback" class="feedback" aria-live="polite"></p>
            <div class="actions">
              <button id="next-button" class="next-button" type="button" hidden>
                Next question <span aria-hidden="true">→</span>
              </button>
            </div>
          </div>
        </div>

        <div id="results" class="results" hidden>
          <div id="results-emoji" class="results-emoji" aria-hidden="true">🚀</div>
          <p class="eyebrow">Mission complete</p>
          <h2 id="results-title">Stellar work!</h2>
          <p id="results-copy" class="result-copy"></p>
          <div class="result-score">
            <span id="final-score">0</span><small>/ <span id="final-score-total">10</span> correct</small>
          </div>
          <div class="results-actions">
            <button id="review-button" class="restart-button" type="button" hidden>
              <span aria-hidden="true">↺</span> Review missed questions
            </button>
            <button id="restart-button" class="restart-button" type="button">
              <span aria-hidden="true">↻</span> Play again
            </button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const questions = [
        {
          question: "Which planet is known as the Red Planet?",
          answers: ["Venus", "Mars", "Jupiter", "Mercury"],
          correct: 1,
          explanation: "Mars looks red because iron minerals in its soil have rusted.",
        },
        {
          question: "What is the name of our galaxy?",
          answers: ["Andromeda", "The Whirlpool", "Milky Way", "Sombrero"],
          correct: 2,
          explanation: "We live in the Milky Way, a barred spiral galaxy.",
        },
        {
          question: "Which object does a planet orbit?",
          answers: ["A moon", "A star", "An asteroid", "A comet"],
          correct: 1,
          explanation: "Planets orbit stars; Earth takes one year to orbit the Sun.",
        },
        {
          question: "What is the largest planet in our solar system?",
          answers: ["Saturn", "Neptune", "Earth", "Jupiter"],
          correct: 3,
          explanation: "Jupiter is the solar system's giant, with more than 1,300 Earths by volume.",
        },
        {
          question: "What do astronauts wear to survive outside a spacecraft?",
          answers: ["A pressure suit", "A raincoat", "A diving suit", "A wingsuit"],
          correct: 0,
          explanation: "A spacesuit provides oxygen, pressure, temperature control, and protection.",
        },
        {
          question: "What force keeps us in orbit around the Sun?",
          answers: ["Magnetism", "Friction", "Gravity", "Electricity"],
          correct: 2,
          explanation: "The Sun's gravity bends Earth's path into a stable orbit.",
        },
        {
          question: "What is a light-year a measurement of?",
          answers: ["Time", "Distance", "Brightness", "Speed"],
          correct: 1,
          explanation: "A light-year is the enormous distance light travels in one year.",
        },
        {
          question: "Which planet has the most famous visible ring system?",
          answers: ["Saturn", "Mars", "Uranus", "Venus"],
          correct: 0,
          explanation: "Saturn's bright rings are made mostly of ice and rocky particles.",
        },
        {
          question: "What was the first human-made object to land on the Moon?",
          answers: ["Apollo 11", "Luna 2", "Voyager 1", "Sputnik 1"],
          correct: 1,
          explanation: "The Soviet Luna 2 probe impacted the Moon in 1959.",
        },
        {
          question: "Which telescope launched in 2021 studies the universe in infrared?",
          answers: ["Hubble", "Kepler", "James Webb", "Chandra"],
          correct: 2,
          explanation: "The James Webb Space Telescope observes faint infrared light from deep space.",
        },
      ];

      const elements = {
        quizView: document.getElementById("quiz-view"),
        results: document.getElementById("results"),
        questionWrap: document.getElementById("question-wrap"),
        questionKicker: document.getElementById("question-kicker"),
        question: document.getElementById("question"),
        answers: document.getElementById("answers"),
        feedback: document.getElementById("feedback"),
        nextButton: document.getElementById("next-button"),
        reviewButton: document.getElementById("review-button"),
        restartButton: document.getElementById("restart-button"),
        score: document.getElementById("score"),
        progressLabel: document.getElementById("progress-label"),
        progressFill: document.getElementById("progress-fill"),
        progressTrack: document.querySelector(".progress-track"),
        finalScore: document.getElementById("final-score"),
        finalScoreTotal: document.getElementById("final-score-total"),
        resultsEmoji: document.getElementById("results-emoji"),
        resultsTitle: document.getElementById("results-title"),
        resultsCopy: document.getElementById("results-copy"),
      };

      let activeQuestions = questions;
      let currentQuestion = 0;
      let score = 0;
      let hasAnswered = false;
      let missedQuestions = [];

      function renderQuestion() {
        const totalQuestions = activeQuestions.length;
        const current = activeQuestions[currentQuestion];
        hasAnswered = false;
        elements.questionKicker.textContent = `Question ${String(currentQuestion + 1).padStart(2, "0")}`;
        elements.question.textContent = current.question;
        elements.progressLabel.textContent = `${currentQuestion + 1} / ${totalQuestions}`;
        elements.progressFill.style.width = `${((currentQuestion + 1) / totalQuestions) * 100}%`;
        elements.progressTrack.setAttribute("aria-valuemax", totalQuestions);
        elements.progressTrack.setAttribute("aria-valuenow", currentQuestion + 1);
        elements.answers.innerHTML = "";
        elements.feedback.textContent = "";
        elements.feedback.className = "feedback";
        elements.nextButton.hidden = true;

        current.answers.forEach((answer, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "answer";
          button.dataset.index = index;
          button.innerHTML = `
            <span class="answer-marker">${String.fromCharCode(65 + index)}</span>
            <span>${answer}</span>
          `;
          button.addEventListener("click", () => selectAnswer(index));
          elements.answers.appendChild(button);
        });

        elements.questionWrap.classList.remove("question-wrap");
        void elements.questionWrap.offsetWidth;
        elements.questionWrap.classList.add("question-wrap");
      }

      function selectAnswer(selectedIndex) {
        if (hasAnswered) return;
        hasAnswered = true;

        const current = activeQuestions[currentQuestion];
        const answerButtons = [...elements.answers.children];
        const selectedButton = answerButtons[selectedIndex];
        const correctButton = answerButtons[current.correct];
        const isCorrect = selectedIndex === current.correct;

        answerButtons.forEach((button) => {
          button.disabled = true;
        });

        if (isCorrect) {
          score += 1;
          selectedButton.classList.add("correct");
          elements.feedback.textContent = `Correct! ${current.explanation}`;
          elements.feedback.className = "feedback good";
          elements.score.textContent = score;
        } else {
          missedQuestions.push(current);
          selectedButton.classList.add("wrong");
          correctButton.classList.add("reveal");
          elements.feedback.textContent = `Not quite — ${current.explanation}`;
          elements.feedback.className = "feedback bad";
        }

        elements.nextButton.textContent =
          currentQuestion === activeQuestions.length - 1 ? "See your results" : "Next question";
        elements.nextButton.hidden = false;
        elements.nextButton.focus();
      }

      function showResults() {
        const totalQuestions = activeQuestions.length;
        const percentage = score / totalQuestions;
        let emoji = "🛰️";
        let title = "Mission complete!";
        let copy = "You made it through the stars. Every answer is another step into the cosmos.";

        if (percentage === 1) {
          emoji = "🌟";
          title = "Absolutely stellar!";
          copy = "Perfect navigation, commander. Your space knowledge is officially out of this world.";
        } else if (percentage >= 0.7) {
          emoji = "🚀";
          title = "Stellar work!";
          copy = "Your cosmic instincts are strong. The next frontier is waiting for you.";
        } else if (percentage >= 0.4) {
          emoji = "🌙";
          title = "Nice orbit!";
          copy = "You found your way through the galaxy. A little more stargazing and you'll be unstoppable.";
        } else {
          emoji = "🪐";
          title = "Keep exploring!";
          copy = "Every great astronaut starts by looking up. Ready to launch another mission?";
        }

        elements.quizView.hidden = true;
        elements.results.hidden = false;
        elements.resultsEmoji.textContent = emoji;
        elements.resultsTitle.textContent = title;
        elements.resultsCopy.textContent = copy;
        elements.finalScore.textContent = score;
        elements.finalScoreTotal.textContent = totalQuestions;
        elements.reviewButton.hidden = missedQuestions.length === 0;
        (elements.reviewButton.hidden ? elements.restartButton : elements.reviewButton).focus();
      }

      function startRound(nextQuestions) {
        activeQuestions = nextQuestions;
        currentQuestion = 0;
        score = 0;
        missedQuestions = [];
        elements.score.textContent = "0";
        elements.quizView.hidden = false;
        elements.results.hidden = true;
        renderQuestion();
      }

      function restart() {
        startRound(questions);
      }

      function reviewMissedQuestions() {
        startRound([...missedQuestions]);
      }

      elements.nextButton.addEventListener("click", () => {
        if (currentQuestion === activeQuestions.length - 1) {
          showResults();
          return;
        }
        currentQuestion += 1;
        renderQuestion();
      });

      elements.reviewButton.addEventListener("click", reviewMissedQuestions);
      elements.restartButton.addEventListener("click", restart);
      startRound(questions);
    </script>
  </body>
</html>
